<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F5F4F1;--surface:#FFF;--ink:#1F1A17;--muted:#6B625B;--line:#E3DED7;--soft:#EFEBE5;--accent:#8A6A2F;--accent-ink:#FFF;--band:#3A2A20;--band-ink:#F3E9DA;--fail:#A63D32;
--display:"Bodoni Moda",Didot,Georgia,serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
.band{background:var(--band);color:var(--band-ink);padding:18px 16px}
.band-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.wordmark{font-family:var(--display);font-size:22px;letter-spacing:.14em;text-transform:uppercase}
.wordmark small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.18em;opacity:.75}
.timer{font-variant-numeric:tabular-nums;font-size:15px;padding:6px 12px;border:1px solid rgba(243,233,218,.35);border-radius:999px}
.timer.low{color:#FFB4A6;border-color:#FFB4A6}
main{padding:28px 16px 64px}
.col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,34px);margin:0;line-height:1.2}
h2{font-size:20px;margin:0}
h3{font-size:16px;margin:0}
p{margin:0}
.muted,.note{color:var(--muted)} .note{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.num{font-size:12px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--accent)} .opt.sel{border-color:var(--accent);background:#F6F0E4}
.opt input{margin-top:4px;accent-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=email],input[type=tel],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:170px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px 20px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 14px;font-size:14px}.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.err{color:var(--fail);font-size:13px;font-weight:600}
.chat{display:flex;flex-direction:column;gap:8px}
.b{max-width:85%;padding:10px 14px;border-radius:12px}
.b.them{background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.b.me{background:#F1E8D6;align-self:flex-end}
.b .who{font-size:12px;font-weight:700;color:var(--muted)}
.fc{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:620px){.fc{grid-template-columns:1fr}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<header class="band"><div class="band-in"><div class="wordmark">Adrian Magnus<small>B2B Sales Executive · Assessment</small></div><div id="timer" class="timer" hidden></div></div></header>
<main id="app"><div class="col"><p class="muted"><span class="spin"></span> Loading…</p></div></main>
<script>
/* When hosted on GitHub Pages: paste your Apps Script web app link (ends with /exec) here. */
const API_URL = 'PASTE_YOUR_WEB_APP_URL_HERE';
const run = (fn, ...args) => (window.google && google.script && google.script.run)
  ? new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args))
  : fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn, args})})
      .then(r => r.json()).then(j => { if(!j.ok) throw new Error(j.error); return j.data; });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
const KEY = 'am-gas-v1';
let T = null, st = null, tick = null, busy = false;

const SECS = [
  {k:'about', title:'About you', mins:3, intro:'Basic details and a few questions about your experience and availability.'},
  {k:'brief', title:'Product brief', mins:2, intro:'Read this carefully. You will answer questions about it next and cannot come back here.'},
  {k:'quiz', title:'Product check', mins:1, intro:'Answer from what you just read.'},
  {k:'sjt', title:'Sales situations', mins:8, intro:'Situations from selling Adrian Magnus cigars to shops, lounges and distributors. Choose what you would most likely do.'},
  {k:'tech', title:'Numbers and tools', mins:4, intro:'Short calculations. A calculator is allowed.'},
  {k:'mot', title:'Work preferences', mins:1, intro:'For each pair, choose the statement that is closer to you. There are no right answers.'},
  {k:'call', title:'Client call', mins:8, intro:'A written phone call with a real-time client. He reacts to what you write. Write as you would speak on the phone, 1–4 sentences per message.'},
  {k:'write', title:'After the call', mins:4, intro:'Every call ends with a recap email and a CRM note. Write both for your call with Daniel.'}
];

function seeded(str){let h=2166136261;for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h=Math.imul(h^h>>>15,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function order(n, seed){const r=seeded(seed),a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){ store.set(KEY, st); }
function remaining(){ return Math.max(0, T.limit*60 - Math.floor((Date.now()-st.start)/1000)); }
function startTimer(){
  const el=$('#timer'); el.hidden=false; clearInterval(tick);
  const up=()=>{const r=remaining(); el.textContent=`${String(Math.floor(r/60)).padStart(2,'0')}:${String(r%60).padStart(2,'0')} left`; el.classList.toggle('low', r<300); if(r<=0){clearInterval(tick); finish(true);}};
  up(); tick=setInterval(up,1000);
}
document.addEventListener('visibilitychange', ()=>{ if(st && !st.done && document.hidden){ st.meta.blur++; save(); }});

function intro(){
  $('#app').innerHTML = `<div class="col">
    <div class="eyebrow">Candidate assessment</div>
    <h1>B2B Sales Executive · Adrian Magnus</h1>
    <p>Adrian Magnus makes premium and ultra-premium cigars and sells them to tobacconists, cigar lounges, wholesalers and distributors across the US and abroad. This assessment shows how you would sell them.</p>
    <div class="q"><h3>Before you start</h3>
      <div class="tw"><table><tbody>${SECS.map((s,i)=>`<tr><td>${i+1}</td><td>${s.title}</td><td class="muted">~${s.mins} min</td></tr>`).join('')}</tbody></table></div>
      <p class="note">About 30 minutes, hard limit ${T.limit} minutes. The timer keeps running if you close the page. You cannot go back to a finished section. Work on your own: pasting text is disabled and leaving the page is recorded.</p>
    </div>
    <div><button class="btn" id="go">Start the assessment</button></div></div>`;
  $('#go').onclick = ()=>{ st={start:Date.now(), sec:0, cand:{}, ans:{CALL:[]}, seed:Math.random().toString(36).slice(2), meta:{paste:0, blur:0}}; save(); section(); };
}

function mc(i, n, total){
  const v = st.ans[i.id];
  return `<div class="q"><div class="num">${n} of ${total}</div><div>${esc(i.text)}</div><div class="opts">${order(i.opts.length, st.seed+i.id).map(ix=>`<label class="opt ${v===ix?'sel':''}"><input type="radio" name="${i.id}" value="${ix}" ${v===ix?'checked':''}><span>${esc(i.opts[ix])}</span></label>`).join('')}</div></div>`;
}
function briefHTML(){ return `<div class="brief">
  <p><b>Adrian Magnus Cigar Corp</b> makes premium and ultra-premium cigars from tobacco grown in the <b>Dominican Republic, Nicaragua and Ecuador</b>. Long aging is the brand's signature.</p>
  <div class="tw"><table><thead><tr><th>Line</th><th>Cigars</th><th>Aging</th></tr></thead><tbody>
  <tr><td>Classic</td><td>Montego, XSO, Original</td><td>—</td></tr>
  <tr><td>Premium</td><td>Millennium, Supremos, Imperials, Connoisseur</td><td>Millennium 5 yrs · Supremos 7 yrs · Imperials Robusto 10 yrs</td></tr>
  <tr><td>Ultra Premium</td><td>Black-Black, XO Cognac, Royal Limited Edition</td><td>Black-Black 12 yrs · XO Cognac Toro 12 yrs · Royal Toro 15 yrs</td></tr>
  <tr><td>Limited Edition</td><td>Royal Limited Edition, Leyenda, El Rey</td><td>—</td></tr>
  <tr><td>Infused</td><td>1808, XO Cognac (cognac-infused), Connoisseur</td><td>—</td></tr>
  </tbody></table></div>
  <p><b>For retailers:</b> shops join through the “Become a retailer” program and order on the B2B portal. Shipping is free on orders over <b>USD 500</b>.</p></div>`; }

function section(){
  if(!st) return intro();
  if(st.done) return doneScreen();
  if(st.sec >= SECS.length) return finish(false);
  startTimer();
  const S = SECS[st.sec]; let body = '';
  if(S.k==='about') body = `<div class="q"><div class="grid2">${T.about.map(i=>{const v=st.cand[i.id]||'';
      return i.type==='select' ? `<label class="f">${esc(i.label)}<select id="c-${i.id}"><option value="">Choose…</option>${i.opts.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`
      : `<label class="f">${esc(i.label)}${i.optional?' <span class="muted" style="font-weight:400">(optional)</span>':''}<input id="c-${i.id}" type="${i.type}" value="${esc(v)}" autocomplete="off"></label>`}).join('')}</div></div>`;
  else if(S.k==='brief') body = briefHTML();
  else if(['quiz','sjt','tech'].includes(S.k)) body = T[S.k].map((i,n)=>mc(i,n+1,T[S.k].length)).join('');
  else if(S.k==='mot') body = T.mot.map((i,n)=>{const v=st.ans[i.id];
      return `<div class="q"><div class="num">${n+1} of ${T.mot.length}</div>${i.text?`<div>${esc(i.text)}</div>`:''}<div class="fc">${i.opts.map((o,ix)=>`<label class="opt ${v===ix?'sel':''}"><input type="radio" name="${i.id}" value="${ix}" ${v===ix?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div></div>`}).join('');
  else if(S.k==='call') body = `<div class="brief"><p><b>You are calling Daniel Reyes</b>, owner of Casa Humo, a tobacconist with a walk-in humidor in Charlotte, North Carolina. He has never heard of Adrian Magnus.</p>
      <p><b>Your goal:</b> understand his shop and agree a first order or a clear next step.</p>
      <p><b>Your limits:</b> discount up to 8%, only in exchange for something · payment terms 30 days for new accounts · free shipping over USD 500.</p>
      <p class="note">Up to ${T.maxTurns} messages. The call ends when you and Daniel wrap up.</p></div><div id="chat" class="chat"></div><div id="callin"></div>`;
  else if(S.k==='write') body = `<div class="q"><label class="f" for="w-W1">Recap email to Daniel (60–120 words): what you discussed and the next steps.</label><textarea id="w-W1">${esc(st.ans.W1||'')}</textarea><div class="note" id="wc">0 words</div></div>
      <div class="q"><label class="f" for="w-W2">CRM note for the account (1–3 lines): status, key facts, next action and date.</label><textarea id="w-W2" style="min-height:90px">${esc(st.ans.W2||'')}</textarea></div>`;
  $('#app').innerHTML = `<div class="col">
    <div class="progress"><i style="width:${Math.round(st.sec/SECS.length*100)}%"></i></div>
    <div class="eyebrow">Section ${st.sec+1} of ${SECS.length} · ~${S.mins} min</div>
    <h2>${S.title}</h2><p class="muted">${S.intro}</p>${body}
    <div class="row spread"><span class="err" id="err"></span><button class="btn" id="next">${st.sec===SECS.length-1?'Submit assessment':'Continue'}</button></div></div>`;
  window.scrollTo(0,0);
  const app = $('#app');
  app.onchange = app.oninput = e => {
    const t = e.target;
    if(t.id && t.id.startsWith('c-')) st.cand[t.id.slice(2)] = t.value;
    else if(t.id && t.id.startsWith('w-')) { st.ans[t.id.slice(2)] = t.value; if(t.id==='w-W1') $('#wc').textContent = words(t.value)+' words'; }
    else if(t.type==='radio'){ st.ans[t.name] = +t.value; t.closest('.opts,.fc').querySelectorAll('label').forEach(l=>l.classList.toggle('sel', l.contains(t))); }
    save();
  };
  app.querySelectorAll('textarea').forEach(ta=>ta.addEventListener('paste', e=>{ if(ta.id==='w-W1'||ta.id==='w-W2'||ta.id==='msg'){ e.preventDefault(); st.meta.paste++; save(); err('Pasting is disabled. Please type your answer.'); }}));
  if($('#w-W1')) $('#wc').textContent = words($('#w-W1').value)+' words';
  if(S.k==='call') drawCall();
  $('#next').onclick = () => {
    if(busy) return;
    const miss = missing(S.k);
    if(miss) return err(miss);
    st.sec++; save(); section();
  };
}
function words(s){ return String(s||'').trim().split(/\s+/).filter(Boolean).length; }
function err(m){ const e=$('#err'); if(e) e.textContent=m; }
function missing(k){
  if(k==='about'){ const n=T.about.filter(i=>!i.optional && !st.cand[i.id]).length; if(n) return `Please answer all questions (${n} left).`; if(!/^\S+@\S+\.\S+$/.test(st.cand.email||'')) return 'Please enter a valid email.'; }
  if(['quiz','sjt','tech','mot'].includes(k)){ const n=T[k].filter(i=>st.ans[i.id]==null).length; if(n) return `Please answer all questions (${n} left).`; }
  if(k==='call' && !st.callEnded) return 'Finish the call first.';
  if(k==='write' && (words(st.ans.W1)<30 || words(st.ans.W2)<5)) return 'Please write the recap email (at least 30 words) and the CRM note.';
  return '';
}

/* ---- client call ---- */
async function drawCall(){
  const chat=$('#chat'), box=$('#callin'); if(!chat) return;
  if(!st.ans.CALL.length){ st.ans.CALL.push({role:'buyer', text:'Casa Humo, Daniel speaking.'}); save(); }
  chat.innerHTML = st.ans.CALL.map(h=>`<div class="b ${h.role==='agent'?'me':'them'}"><div class="who">${h.role==='agent'?'You':'Daniel (client)'}</div>${esc(h.text)}</div>`).join('');
  const sent = st.ans.CALL.filter(h=>h.role==='agent').length;
  if(st.callEnded){ box.innerHTML = `<p class="note">The call has ended. Continue to the next section.</p>`; return; }
  const last = st.ans.CALL[st.ans.CALL.length-1];
  if(last.role==='agent'){ return getReply(); }
  box.innerHTML = `<div class="q"><label class="f" for="msg">Your message (${sent+1} of ${T.maxTurns})</label><textarea id="msg" style="min-height:80px"></textarea>
    <div class="row"><button class="btn sm" id="send" type="button">Send</button><span class="note">Press Send when ready. You cannot edit a message after sending.</span></div></div>`;
  const msg=$('#msg');
  msg.addEventListener('paste', e=>{ e.preventDefault(); st.meta.paste++; save(); err('Pasting is disabled. Please type your answer.'); });
  msg.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('#send').click(); }});
  msg.focus();
  $('#send').onclick = ()=>{ const v=msg.value.trim(); if(v.length<3) return err('Write a message first.'); err(''); st.ans.CALL.push({role:'agent', text:v.slice(0,1200)}); save(); drawCall(); };
}
async function getReply(){
  const box=$('#callin'); busy=true;
  box.innerHTML = `<p class="note"><span class="spin"></span> Daniel is answering…</p>`;
  try{
    const r = await run('buyerReply', st.ans.CALL);
    st.ans.CALL.push({role:'buyer', text:r.text});
    if(r.end) st.callEnded = true;
    save(); busy=false; drawCall();
  }catch(e){
    busy=false;
    box.innerHTML = `<p class="err">The line dropped. Your message was kept.</p><button class="btn sm" id="retry" type="button">Try again</button>`;
    $('#retry').onclick = getReply;
  }
}

/* ---- submit ---- */
async function finish(timeout){
  clearInterval(tick);
  if(st.done) return doneScreen();
  $('#timer').hidden = true;
  $('#app').innerHTML = `<div class="col"><h2>Submitting…</h2><p class="muted"><span class="spin"></span> Please keep this page open. This takes up to a minute.</p></div>`;
  const payload = {cand:st.cand, ans:st.ans, meta:{...st.meta, seconds:Math.min(T.limit*60, Math.floor((Date.now()-st.start)/1000)), timeout:!!timeout}};
  try{ await run('submit', payload); st.done = true; save(); doneScreen(); }
  catch(e){ $('#app').innerHTML = `<div class="col"><h2>Your answers were not sent yet</h2><p>Check your internet connection and try again. Your answers are kept on this device.</p><div><button class="btn" id="again">Send again</button></div></div>`; $('#again').onclick=()=>finish(timeout); }
}
function doneScreen(){
  $('#timer').hidden = true;
  $('#app').innerHTML = `<div class="col"><div class="eyebrow">Submitted</div><h1>Thank you${st.cand.name?', '+esc(st.cand.name.split(' ')[0]):''}.</h1>
    <p>Your assessment has been received. The hiring team will review it and contact you about next steps.</p></div>`;
}

run('getTest').then(t=>{ T=t; st=store.get(KEY); section(); }).catch(()=>{ $('#app').innerHTML='<div class="col"><p class="err">The assessment could not load. Please refresh the page.</p></div>'; });
</script>
</body>
</html>
